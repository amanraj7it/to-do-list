<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    #app {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 2rem 1.75rem 2.5rem;
      border: 0.5px solid #e0e0d8;
    }

    h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; color: #1a1a1a; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 1.75rem; }

    /* Add row */
    .add-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
    .add-row input {
      flex: 1; font-size: 15px; padding: 10px 14px;
      border: 0.5px solid #d0d0c8; border-radius: 10px;
      background: #fafaf8; color: #1a1a1a; outline: none;
      transition: border-color 0.15s;
    }
    .add-row input:focus { border-color: #888; background: #fff; }
    .add-row input::placeholder { color: #bbb; }
    .add-row button {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 500; padding: 10px 18px;
      border: 0.5px solid #d0d0c8; border-radius: 10px;
      background: #1a1a1a; color: #fff; cursor: pointer;
      white-space: nowrap; transition: background 0.15s;
    }
    .add-row button:hover { background: #333; }

    /* Stats */
    .stats { display: flex; gap: 10px; margin-bottom: 1.25rem; }
    .stat { background: #f5f5f0; border-radius: 10px; padding: 12px 16px; flex: 1; text-align: center; }
    .stat-num { font-size: 22px; font-weight: 600; color: #1a1a1a; }
    .stat-label { font-size: 12px; color: #888; margin-top: 2px; }

    /* Filters */
    .filters { display: flex; gap: 6px; margin-bottom: 1.1rem; flex-wrap: wrap; }
    .filter-btn {
      font-size: 13px; padding: 6px 16px;
      border: 0.5px solid #d0d0c8; border-radius: 20px;
      background: transparent; color: #888; cursor: pointer; transition: all 0.15s;
    }
    .filter-btn:hover { background: #f5f5f0; color: #1a1a1a; }
    .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* Task list */
    .task-list { display: flex; flex-direction: column; gap: 6px; min-height: 60px; }
    .task {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border: 0.5px solid #e0e0d8;
      border-radius: 10px; padding: 12px 14px; transition: opacity 0.2s;
    }
    .task.done { opacity: 0.5; }
    .task.done .task-text { text-decoration: line-through; color: #aaa; }

    /* Check button */
    .check-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid #ccc; background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 15px; color: transparent; transition: all 0.15s;
    }
    .check-btn:hover { border-color: #4caf88; }
    .task.done .check-btn { background: #e6f4ee; border-color: #4caf88; color: #2e7d5e; }

    .task-text { flex: 1; font-size: 15px; color: #1a1a1a; line-height: 1.4; word-break: break-word; }
    .task-meta { font-size: 12px; color: #bbb; white-space: nowrap; }

    /* Delete button */
    .del-btn {
      background: transparent; border: none; cursor: pointer;
      color: #ccc; font-size: 18px; padding: 2px 4px; border-radius: 6px;
      display: flex; align-items: center; transition: color 0.15s; flex-shrink: 0;
    }
    .del-btn:hover { color: #e24b4a; }

    /* Empty state */
    .empty { text-align: center; padding: 3rem 1rem; color: #bbb; font-size: 15px; }
    .empty i { font-size: 42px; display: block; margin-bottom: 12px; opacity: 0.35; }

    /* Bottom bar */
    .bottom-bar { text-align: right; margin-top: 1rem; }
    .clear-done {
      font-size: 13px; color: #888; background: transparent;
      border: 0.5px solid #d0d0c8; border-radius: 8px; padding: 6px 14px;
      cursor: pointer; transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .clear-done:hover { background: #f5f5f0; color: #1a1a1a; }

    /* Responsive */
    @media (max-width: 480px) {
      #app { padding: 1.5rem 1.25rem 2rem; }
      h1 { font-size: 20px; }
      .stats { gap: 8px; }
      .stat { padding: 10px; }
      .stat-num { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>✅ My Tasks</h1>
    <p class="subtitle">Stay on top of what matters.</p>

    <div class="add-row">
      <input type="text" id="task-input" placeholder="Add a new task…" maxlength="120" />
      <button id="add-btn">
        <i class="ti ti-plus"></i> Add
      </button>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num" id="stat-done">0</div><div class="stat-label">Done</div></div>
      <div class="stat"><div class="stat-num" id="stat-left">0</div><div class="stat-label">Left</div></div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Completed</button>
    </div>

    <div class="task-list" id="task-list"></div>

    <div class="bottom-bar">
      <button class="clear-done" id="clear-done-btn">
        <i class="ti ti-trash"></i> Clear completed
      </button>
    </div>
  </div>

  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let tasks = [];
    let filter = 'all';

    // ─── Load from localStorage ───────────────────────────────────────────────
    function load() {
      try { tasks = JSON.parse(localStorage.getItem('todo-tasks') || '[]'); }
      catch (e) { tasks = []; }
      render();
    }

    // ─── Save to localStorage ─────────────────────────────────────────────────
    function save() {
      try { localStorage.setItem('todo-tasks', JSON.stringify(tasks)); }
      catch (e) {}
    }

    // ─── Add a task ───────────────────────────────────────────────────────────
    function addTask() {
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      tasks.unshift({ id: Date.now(), text, done: false, created: Date.now() });
      input.value = '';
      input.focus();
      save(); render();
    }

    // ─── Toggle done ──────────────────────────────────────────────────────────
    function toggle(id) {
      const task = tasks.find(t => t.id === id);
      if (task) { task.done = !task.done; save(); render(); }
    }

    // ─── Delete a task ────────────────────────────────────────────────────────
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      save(); render();
    }

    // ─── Clear completed ──────────────────────────────────────────────────────
    function clearDone() {
      tasks = tasks.filter(t => !t.done);
      save(); render();
    }

    // ─── Set filter ───────────────────────────────────────────────────────────
    function setFilter(f) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(btn =>
        btn.classList.toggle('active', btn.dataset.filter === f)
      );
      render();
    }

    // ─── Time ago helper ──────────────────────────────────────────────────────
    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    // ─── Escape HTML ──────────────────────────────────────────────────────────
    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ─── Render ───────────────────────────────────────────────────────────────
    function render() {
      const total = tasks.length;
      const done  = tasks.filter(t => t.done).length;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-done').textContent  = done;
      document.getElementById('stat-left').textContent  = total - done;

      const visible = tasks.filter(t =>
        filter === 'done' ? t.done : filter === 'active' ? !t.done : true
      );

      const list = document.getElementById('task-list');
      if (!visible.length) {
        const msgs = { all: 'No tasks yet — add one above!', active: 'No active tasks.', done: 'Nothing completed yet.' };
        list.innerHTML = `<div class="empty"><i class="ti ti-checkbox"></i>${msgs[filter]}</div>`;
        return;
      }

      list.innerHTML = visible.map(t => `
        <div class="task${t.done ? ' done' : ''}" id="task-${t.id}">
          <button class="check-btn" onclick="toggle(${t.id})" aria-label="${t.done ? 'Mark incomplete' : 'Mark complete'}">
            ${t.done ? '<i class="ti ti-check"></i>' : ''}
          </button>
          <span class="task-text">${escHtml(t.text)}</span>
          <span class="task-meta">${timeAgo(t.created)}</span>
          <button class="del-btn" onclick="deleteTask(${t.id})" aria-label="Delete task">
            <i class="ti ti-trash"></i>
          </button>
        </div>
      `).join('');
    }

    // ─── Event listeners ──────────────────────────────────────────────────────
    document.getElementById('task-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });
    document.getElementById('add-btn').addEventListener('click', addTask);
    document.getElementById('clear-done-btn').addEventListener('click', clearDone);
    document.querySelectorAll('.filter-btn').forEach(btn =>
      btn.addEventListener('click', () => setFilter(btn.dataset.filter))
    );

    // ─── Init ─────────────────────────────────────────────────────────────────
    load();
  </script>
</body>
</html>
